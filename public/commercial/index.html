<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LionOS Commercial</title><style>
*{box-sizing:border-box}body{margin:0;background:#080a0f;color:#f5f6f8;font:14px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1180px;margin:auto;padding:36px 20px}.brand{font-size:24px;font-weight:900}.brand span{color:#d6b15e}.eyebrow{margin-top:42px;color:#aa8942;font-size:11px;font-weight:800;letter-spacing:.13em;text-transform:uppercase}h1{font-size:40px;margin:7px 0}.sub{color:#818b99}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}.panel{border:1px solid #202735;background:#0d1118;border-radius:14px;padding:18px}.panel h2{margin:0 0 12px;font-size:18px}.row{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-top:1px solid #1d2430}.row span{color:#7c8797}.good{color:#8dce76}.cta{display:inline-block;margin-top:10px;padding:9px 12px;border-radius:9px;background:#d6b15e;color:#111;font-weight:900;text-decoration:none;border:0;cursor:pointer}.empty{color:#758090}.stack{display:grid;gap:8px}.input{width:100%;padding:10px;background:#0a0f15;color:white;border:1px solid #2a3340;border-radius:8px}.preview{white-space:pre-wrap;color:#cfd5dc}.wide{grid-column:1/-1}@media(max-width:760px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}
</style></head><body><div class="wrap"><div class="brand">Lion<span>OS</span></div><div class="eyebrow">COMMERCIAL</div><h1>Plan, usage, agency, launch.</h1><p class="sub">Self-serve pricing context, current-period usage detail, cross-workspace reporting and a compressed onboarding preview.</p>
<div class="grid">
<section class="panel"><h2>Plans & credit packs</h2><div id="catalog" class="empty">Loading…</div></section>
<section class="panel"><h2>This period</h2><div id="usage" class="empty">Loading…</div></section>
<section class="panel wide"><h2>Agency rollup</h2><div id="agency" class="empty">Loading…</div></section>
<section class="panel wide"><h2>Fast onboarding</h2><div class="stack"><input id="company" class="input" placeholder="Company name"><input id="website" class="input" placeholder="Website"><input id="keywords" class="input" placeholder="Keywords, comma separated"><select id="channel" class="input"><option value="email">Email</option><option value="linkedin">LinkedIn</option></select><button class="cta" id="previewBtn">Build preview</button><div id="preview" class="preview"></div></div></section>
</div></div>
<script>
const q=new URLSearchParams(location.search),workspaceId=q.get('workspaceId'),token=localStorage.getItem('lionosSessionToken')||'';const $=id=>document.getElementById(id);
async function api(path,opts={}){opts.headers={...(opts.headers||{}),'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})};const r=await fetch(path,opts);const j=await r.json();if(!r.ok)throw new Error(j.error||'Request failed');return j}
async function load(){
 try{const j=await api('/api/gtm/commercial/catalog');const plans=Object.values(j.plans||{});$('catalog').className='';$('catalog').innerHTML=plans.map(x=>'<div class="row"><span>'+x.key+'</span><strong>$'+(x.monthlyCents/100).toFixed(0)+'/mo</strong></div>').join('')+(j.creditPacks||[]).map(x=>'<div class="row"><span>'+x.key+'</span><strong>$'+(x.priceCents/100).toFixed(0)+'</strong></div>').join('')}catch(e){$('catalog').textContent=e.message}
 if(!workspaceId){$('usage').textContent='Missing workspaceId';$('agency').textContent='Missing workspaceId';return}
 try{const j=await api('/api/gtm/workspaces/'+workspaceId+'/usage/period');$('usage').className='';$('usage').innerHTML=(j.breakdown||[]).length?(j.breakdown||[]).map(x=>'<div class="row"><span>'+x.purse+' · '+x.actionKey+'</span><strong>'+x.credits+' cr</strong></div>').join(''):'<div class="empty">No usage this period.</div>'}catch(e){$('usage').textContent=e.message}
 try{const j=await api('/api/gtm/agency/report');$('agency').className='';$('agency').innerHTML='<div class="row"><span>Total sourced</span><strong>'+j.totals.sourced+'</strong></div><div class="row"><span>Total replies</span><strong>'+j.totals.replied+'</strong></div><div class="row"><span>Total booked</span><strong>'+j.totals.booked+'</strong></div>'+(j.workspaces||[]).map(x=>'<div class="row"><span>'+x.name+'</span><strong>'+x.sourced+' / '+x.replied+' / '+x.booked+'</strong></div>').join('')}catch(e){$('agency').textContent=e.message}
}
$('previewBtn').onclick=async()=>{try{const j=await api('/api/gtm/workspaces/'+workspaceId+'/onboarding/preview',{method:'POST',body:JSON.stringify({companyName:$('company').value,website:$('website').value,keywords:$('keywords').value.split(',').map(x=>x.trim()).filter(Boolean),channel:$('channel').value})});$('preview').textContent=JSON.stringify(j.preview.preview,null,2)}catch(e){$('preview').textContent=e.message}};
load();
</script></body></html>
