<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BuildPipeline Account</title><style>
body{margin:0;background:#090b10;color:#f5f6f8;font:15px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1050px;margin:auto;padding:34px 20px}.brand{font-size:24px;font-weight:900}.brand span{color:#d3aa52}.top{display:flex;justify-content:space-between;align-items:center}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:26px}.card{background:#0e1219;border:1px solid #252d38;border-radius:14px;padding:20px}.card h3{margin-top:0}.muted{color:#87919d}.btn{display:inline-block;padding:10px 13px;border-radius:9px;background:#d3aa52;color:#111;text-decoration:none;font-weight:900;border:0;cursor:pointer}.ghost{background:#141922;color:#e9edf1;border:1px solid #2b333e}.workspace{margin-top:18px;background:#0e1219;border:1px solid #252d38;border-radius:14px;padding:20px}.row{display:flex;justify-content:space-between;border-top:1px solid #202733;padding:9px 0}.row:first-child{border-top:0}@media(max-width:760px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><div class="brand">Build<span>Pipeline</span></div><button class="btn ghost" id="logout">Sign out</button></div><h1>Your GTM workspace</h1><p class="muted" id="welcome">Loading your account…</p><div id="workspace"></div><div class="grid"><div class="card"><h3>Launch</h3><p class="muted">Connect your company, ICP, senders and calendar.</p><a class="btn" id="setup" href="/gtm/onboarding/">Open onboarding</a></div><div class="card"><h3>Operate</h3><p class="muted">Work campaigns, agents, templates and transcripts.</p><a class="btn" id="operator" href="/operator/">Open operator</a></div><div class="card"><h3>Billing</h3><p class="muted">Manage your subscription and billing method in Stripe.</p><button class="btn" id="billing">Manage billing</button></div></div></div>
<script>
const token=localStorage.getItem('lionosSessionToken');if(!token)location.replace('/gtm/access/');
async function api(path,opts={}){opts.headers={...(opts.headers||{}),Authorization:'Bearer '+token,'Content-Type':'application/json'};const r=await fetch(path,opts);const j=await r.json();if(!r.ok)throw new Error(j.error||'Request failed');return j}
(async()=>{try{const me=await api('/api/gtm/auth/me');document.getElementById('welcome').textContent=me.user.email;const ws=me.memberships||[];document.getElementById('workspace').innerHTML=ws.map(x=>'<div class="workspace"><div class="row"><strong>'+x.name+'</strong><span>'+x.plan+'</span></div><div class="row"><span>Role</span><span>'+x.role+'</span></div><div class="row"><span>Status</span><span>'+x.status+'</span></div></div>').join('')||'<div class="workspace">No workspace is attached yet.</div>';if(ws[0]){const id=encodeURIComponent(ws[0].workspaceId);document.getElementById('setup').href='/production-setup/?workspaceId='+id;document.getElementById('operator').href='/operator/?workspaceId='+id}}catch(e){localStorage.removeItem('lionosSessionToken');location.replace('/gtm/access/')}})();
document.getElementById('billing').onclick=async()=>{try{const j=await api('/api/gtm-sales/billing-portal',{method:'POST'});location.href=j.url}catch(e){alert(e.message)}};
document.getElementById('logout').onclick=async()=>{try{await api('/api/gtm/auth/logout',{method:'POST'})}catch{}localStorage.removeItem('lionosSessionToken');location.replace('/gtm/access/')};
</script></body></html>
