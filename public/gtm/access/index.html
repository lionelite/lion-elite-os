<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BuildPipeline Access</title><style>
body{margin:0;background:#090b10;color:#f5f6f8;font:15px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:520px;margin:0 auto;padding:72px 20px}.brand{font-size:24px;font-weight:900}.brand span{color:#d3aa52}.card{margin-top:32px;background:#0e1219;border:1px solid #252d38;border-radius:16px;padding:24px}h1{font-size:38px;line-height:1.1}.muted{color:#87919d}.input{width:100%;padding:12px;border-radius:9px;border:1px solid #2b333e;background:#090d12;color:#fff;margin-top:10px}.btn{width:100%;padding:12px;border-radius:9px;background:#d3aa52;border:0;font-weight:900;color:#111;margin-top:10px;cursor:pointer}.status{margin-top:12px;color:#8e98a5;font-size:13px}.ok{color:#82d9a2}</style></head><body><div class="wrap"><div class="brand">Build<span>Pipeline</span></div><div class="card"><h1>Open your workspace.</h1><p class="muted">Enter the email used for your BuildPipeline account. We’ll send a one-time sign-in link.</p><input class="input" id="email" type="email" placeholder="you@company.com"><button class="btn" id="send">Email me a sign-in link</button><div id="status" class="status"></div></div></div>
<script>
const q=new URLSearchParams(location.search),token=q.get('token'),status=document.getElementById('status');
async function exchange(){if(!token)return;status.textContent='Opening your workspace…';const r=await fetch('/api/gtm-sales/access/exchange',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})});const j=await r.json();if(!r.ok){status.textContent=j.error||'This link is invalid or expired.';return}localStorage.setItem('lionosSessionToken',j.sessionToken);const first=j.workspaces&&j.workspaces[0];location.replace('/gtm/account/'+(first?('?workspaceId='+encodeURIComponent(first.workspaceId)):'') )}
document.getElementById('send').onclick=async()=>{const email=document.getElementById('email').value.trim();status.textContent='Sending…';const r=await fetch('/api/gtm-sales/access/request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})});if(r.ok){status.className='status ok';status.textContent='If that email has a BuildPipeline account, the sign-in link is on the way.'}else{const j=await r.json();status.textContent=j.error||'Could not send access link.'}};
exchange();
</script></body></html>
