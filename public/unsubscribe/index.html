<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unsubscribe · Lion Elite</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="/optin/styles.css?v=1">
</head>
<body>
  <main class="wrap">
    <p class="eyebrow">Lion Elite</p>
    <h1 id="headline">Unsubscribe</h1>
    <p class="lede" id="lede">Confirm below and we will stop sending.</p>

    <section class="card" id="card">
      <form id="unsub-form" novalidate>
        <label>
          Email address
          <input name="email" type="email" autocomplete="email" required placeholder="you@example.com">
        </label>
        <button type="submit" id="submit">Unsubscribe me</button>
        <p class="message" id="message" role="status" aria-live="polite"></p>
      </form>
      <p class="note">
        This stops marketing email and texts. If you are an active coaching client, service messages
        about your own program are unaffected — contact your coach to change those.
      </p>
    </section>
  </main>
  <script src="/unsubscribe/app.js?v=1" defer></script>
</body>
</html>
