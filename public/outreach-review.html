<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lion Elite Outreach Review</title><style>body{font-family:system-ui;background:#0f1115;color:#eee;max-width:980px;margin:0 auto;padding:24px}button,input,textarea{font:inherit}.top{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.card{border:1px solid #2b2f36;border-radius:12px;padding:18px;margin:16px 0;background:#16191f}.meta{color:#9ba3af;font-size:14px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}textarea{width:100%;min-height:180px;background:#0f1115;color:#eee;border:1px solid #343943;border-radius:8px;padding:10px;box-sizing:border-box}input{background:#0f1115;color:#eee;border:1px solid #343943;border-radius:8px;padding:10px}.actions{display:flex;gap:8px;margin-top:12px}button{border:0;border-radius:8px;padding:10px 14px;cursor:pointer}.approve{background:#2c7a4b;color:white}.save{background:#394150;color:white}.skip{background:#7a2c2c;color:white}.pill{display:inline-block;padding:3px 8px;border-radius:999px;background:#273142;margin-right:6px}</style></head><body><h1>B2B Outreach Review</h1><p>Validated partnership drafts only. Nothing sends until you approve it.</p><div class="top"><input id="token" type="password" placeholder="Review token"><button class="save" onclick="load()">Load queue</button><span id="status" class="meta"></span></div><div id="list"></div><script>const el=id=>document.getElementById(id);function headers(){return {'Content-Type':'application/json','Authorization':'Bearer '+el('token').value}}async function load(){localStorage.setItem('reviewToken',el('token').value);el('status').textContent='Loading...';const r=await fetch('/api/review?limit=10',{headers:headers()});const d=await r.json();if(!r.ok){el('status').textContent=d.error||'Error';return}el('status').textContent=`${d.count} drafts · ${d.quota.remaining} emails left today`;el('list').innerHTML=d.items.map(card).join('')}function card(x){const b=x.prospect?.business||{};return `<div class="card" id="c-${x.queueId}"><div><span class="pill">${esc(b.name||'Unknown business')}</span><span class="pill">score ${x.prospect?.score??'—'}</span><span class="pill">${esc(x.campaignId||'campaign')}</span></div><p class="meta">${esc(b.website||'')} · ${esc(x.recipient||'')}</p><label>Subject</label><input id="s-${x.queueId}" value="${escAttr(x.subject||'')}" style="width:100%;box-sizing:border-box"><label>Body</label><textarea id="b-${x.queueId}">${esc(x.body||'')}</textarea><div class="actions"><button class="approve" onclick="approve('${x.queueId}')">Approve & Send</button><button class="save" onclick="save('${x.queueId}')">Save Edit</button><button class="skip" onclick="skip('${x.queueId}')">Skip</button></div></div>`}function esc(v){return String(v).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function escAttr(v){return esc(v).replace(/"/g,'&quot;')}async function save(id){const r=await fetch('/api/review/'+id,{method:'PATCH',headers:headers(),body:JSON.stringify({subject:el('s-'+id).value,body:el('b-'+id).value})});if(r.ok)el('status').textContent='Draft saved'}async function approve(id){if(!confirm('Approve and send this message?'))return;const r=await fetch('/api/review/'+id+'/approve',{method:'POST',headers:headers(),body:JSON.stringify({subject:el('s-'+id).value,body:el('b-'+id).value})});const d=await r.json();if(!r.ok){alert(d.error||'Approval failed');return}el('c-'+id).remove();el('status').textContent='Approved and queued for sending'}async function skip(id){const r=await fetch('/api/review/'+id+'/skip',{method:'POST',headers:headers(),body:'{}'});if(r.ok){el('c-'+id).remove();el('status').textContent='Skipped'}}el('token').value=localStorage.getItem('reviewToken')||'';</script></body></html>
