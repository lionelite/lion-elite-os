<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LionOS Operator</title><style>
*{box-sizing:border-box}body{margin:0;background:#080a0f;color:#f5f6f8;font:14px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1180px;margin:auto;padding:36px 20px}.brand{font-size:24px;font-weight:900}.brand span{color:#d6b15e}.eyebrow{margin-top:42px;color:#aa8942;font-size:11px;font-weight:800;letter-spacing:.13em;text-transform:uppercase}h1{font-size:40px;margin:7px 0}.sub{color:#818b99}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}.tabs button{padding:9px 12px;border-radius:9px;border:1px solid #2a3340;background:#111720;color:#dfe4ea;font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.panel{border:1px solid #202735;background:#0d1118;border-radius:14px;padding:18px}.panel h2{margin:0 0 12px;font-size:18px}.item{padding:11px 0;border-top:1px solid #1d2430}.item small{display:block;color:#74808f}.empty{color:#74808f}.transcript{max-height:460px;overflow:auto}.turn{margin:10px 0;padding:12px;border-radius:10px;background:#101620;border:1px solid #242d39}.turn.tool{border-style:dashed}.turn small{color:#7e8999}.composer textarea{width:100%;min-height:100px;background:#090d13;color:white;border:1px solid #2b3442;border-radius:9px;padding:12px}.composer button{margin-top:8px;padding:10px 13px;border:1px solid #dfbf72;background:#d6b15e;color:#111;border-radius:9px;font-weight:900}@media(max-width:760px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><div class="brand">Lion<span>OS</span></div><div class="eyebrow">OPERATOR</div><h1>One screen to run the motion.</h1><p class="sub">Templates, audiences, sequences, agent settings and transcript/tool history in one workspace surface.</p>
<div class="grid"><section class="panel"><h2>Campaign library</h2><div id="library" class="empty">Loading…</div></section><section class="panel"><h2>Agent settings</h2><div id="settings" class="empty">Loading…</div></section></div>
<section class="panel" style="margin-top:14px"><h2>Agent conversation</h2><div id="transcript" class="transcript empty">Create or open a thread to see full turns and tool output.</div><div class="composer"><textarea id="msg" placeholder="Tell LionOS what to do…"></textarea><button id="send">Add turn</button></div></section></div>
<script>
const q=new URLSearchParams(location.search),workspaceId=q.get('workspaceId'),token=localStorage.getItem('lionosSessionToken')||'';const $=id=>document.getElementById(id);let threadId=null;
async function api(path,opts={}){opts.headers={...(opts.headers||{}),'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})};const r=await fetch(path,opts);const j=await r.json();if(!r.ok)throw new Error(j.error||'Request failed');return j}
async function load(){if(!workspaceId){$('library').textContent='Missing workspaceId';$('settings').textContent='Missing workspaceId';return}
try{const j=await api('/api/gtm/workspaces/'+workspaceId+'/library');$('library').className='';$('library').innerHTML=[
  ['Templates',j.templates],['Audiences',j.audiences],['Sequences',j.sequences]
].map(([label,items])=>'<div class="item"><strong>'+label+' · '+items.length+'</strong>'+(items.slice(0,5).map(x=>'<small>'+((x.name)||'Untitled')+'</small>').join('')||'<small>None yet</small>')+'</div>').join('')}catch(e){$('library').textContent=e.message}
try{const j=await api('/api/gtm/workspaces/'+workspaceId+'/agent-settings');$('settings').className='';$('settings').innerHTML=(j.settings||[]).length?(j.settings||[]).map(x=>'<div class="item"><strong>'+x.agentKey+'</strong><small>'+x.modelTier+(x.cadenceSeconds?' · '+x.cadenceSeconds+'s':'')+(x.sendPolicy?' · '+x.sendPolicy:'')+'</small></div>').join(''):'<div class="empty">Using defaults. Override only what you want to change.</div>'}catch(e){$('settings').textContent=e.message}}
async function ensureThread(){if(threadId)return threadId;const j=await api('/api/gtm/workspaces/'+workspaceId+'/agent-threads',{method:'POST',body:JSON.stringify({title:'Operator thread'})});threadId=j.thread.agentThreadId;return threadId}
$('send').onclick=async()=>{if(!workspaceId)return;try{const t=await ensureThread(),content=$('msg').value.trim();if(!content)return;await api('/api/gtm/workspaces/'+workspaceId+'/agent-threads/'+t+'/turns',{method:'POST',body:JSON.stringify({role:'user',content})});$('msg').value='';const j=await api('/api/gtm/workspaces/'+workspaceId+'/agent-threads/'+t);$('transcript').className='transcript';$('transcript').innerHTML=(j.turns||[]).map(x=>'<div class="turn '+(x.role==='tool'?'tool':'')+'"><small>'+x.role+(x.toolName?' · '+x.toolName:'')+' · '+x.status+'</small><div>'+String(x.content||'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))+'</div></div>').join('')}catch(e){$('transcript').textContent=e.message}};
load();
</script></body></html>
