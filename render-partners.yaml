services:
  - type: web
    name: lion-elite-partner-applications
    runtime: node
    plan: starter
    autoDeploy: true
    buildCommand: npm install
    startCommand: node partner-application-server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: INTEGRATION_GATEWAY_URL
        sync: false
      - key: AFFILIATE_WEBHOOK_SECRET
        sync: false
      - key: PARTNER_APPLICATION_MAX_BODY
        value: 256kb
