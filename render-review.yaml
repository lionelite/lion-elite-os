services:
  - type: web
    name: lion-elite-outreach-review
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: node outreach-review-server.js
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: OUTREACH_REVIEW_TOKEN
        generateValue: true
      - key: DAILY_EMAIL_LIMIT
        value: "100"
