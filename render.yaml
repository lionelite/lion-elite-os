databases:
  - name: lion-elite-os-db
    databaseName: lion_elite_os
    user: lion_elite_os
    plan: basic-256mb

services:
  - type: keyvalue
    name: lion-elite-os-redis
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: noeviction

  - type: web
    name: lion-elite-os
    runtime: node
    plan: starter
    buildCommand: npm install --no-audit --no-fund && npm run db:migrate
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: lion-elite-os-db
          property: connectionString
      - key: DAILY_EMAIL_LIMIT
        value: 100
      - key: PG_POOL_MAX
        value: 10
      - key: COACH_PORTAL_ADMIN_TOKEN
        generateValue: true
      # Payment. Checkout stays disabled (503) until the first two are set,
      # and the webhook refuses to process anything without the third, so
      # leaving these blank is safe — it simply means nothing can be sold yet.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Public origin used for Stripe return URLs and coaching invite links.
      - key: COACHING_PUBLIC_URL
        sync: false

  - type: web
    name: lion-elite-outreach-api
    runtime: node
    plan: starter
    buildCommand: npm install --no-audit --no-fund && npm run db:migrate
    startCommand: node outreach-server-postgres.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: lion-elite-os-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: lion-elite-os-redis
          property: connectionString
      - key: DAILY_EMAIL_LIMIT
        value: 100
      - key: PG_POOL_MAX
        value: 10
      - key: JOB_ATTEMPTS
        value: 4
      - key: JOB_BACKOFF_MS
        value: 5000

  - type: web
    name: lion-elite-executive-api
    runtime: node
    plan: starter
    buildCommand: npm install --no-audit --no-fund
    startCommand: npm run executive
    healthCheckPath: /health
    autoDeploy: true
    envVars: &executiveEnv
      - key: NODE_ENV
        value: production
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: lion-elite-os-redis
          property: connectionString
      - key: EXECUTIVE_API_TOKEN
        generateValue: true
      - key: JOB_ATTEMPTS
        value: 4
      - key: JOB_BACKOFF_MS
        value: 5000
      - key: JOB_LOCK_TTL_MS
        value: 120000
      - key: EXECUTIVE_QUEUE_WARNING
        value: 100

  - type: worker
    name: lion-elite-outreach-worker
    runtime: node
    plan: starter
    buildCommand: npm install --no-audit --no-fund && npm run db:migrate
    startCommand: npm run worker:outreach
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: lion-elite-os-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: lion-elite-os-redis
          property: connectionString
      - key: DAILY_EMAIL_LIMIT
        value: 100
      - key: WORKER_CONCURRENCY
        value: 5
      - key: JOB_ATTEMPTS
        value: 4
      - key: JOB_BACKOFF_MS
        value: 5000
      - key: JOB_LOCK_TTL_MS
        value: 120000
      - key: WORKER_HEARTBEAT_SECONDS
        value: 15
      - key: QUEUE_LAG_WARNING
        value: 100
      - key: SHUTDOWN_TIMEOUT_MS
        value: 30000

  - type: worker
    name: lion-elite-executive-worker
    runtime: node
    plan: starter
    buildCommand: npm install --no-audit --no-fund
    startCommand: npm run worker:executive
    autoDeploy: true
    envVars: *executiveEnv

  - type: cron
    name: lion-elite-operations-monitor
    runtime: node
    schedule: "*/5 * * * *"
    buildCommand: npm install --no-audit --no-fund
    startCommand: node scripts/operations-monitor.js
    envVars: &monitorEnv
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: lion-elite-os-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: lion-elite-os-redis
          property: connectionString
      - key: MONITORED_WORKER_NAME
        value: lion-elite-outreach-worker
      - key: WORKER_HEARTBEAT_MAX_AGE_SECONDS
        value: 60
      - key: QUEUE_LAG_WARNING
        value: 100
      - key: FAILED_JOB_WARNING
        value: 10

  - type: cron
    name: lion-elite-business-discovery
    runtime: node
    schedule: "0 */4 * * *"
    buildCommand: npm install --no-audit --no-fund
    startCommand: node scripts/cron-scheduler.js discovery
    envVars: &cronEnv
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: lion-elite-os-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: lion-elite-os-redis
          property: connectionString
      - key: JOB_ATTEMPTS
        value: 4
      - key: JOB_BACKOFF_MS
        value: 5000

  - type: cron
    name: lion-elite-stale-data-refresh
    runtime: node
    schedule: "15 */6 * * *"
    buildCommand: npm install --no-audit --no-fund
    startCommand: node scripts/cron-scheduler.js staleData
    envVars: *cronEnv

  - type: cron
    name: lion-elite-followup-scheduler
    runtime: node
    schedule: "0 * * * *"
    buildCommand: npm install --no-audit --no-fund
    startCommand: node scripts/cron-scheduler.js followups
    envVars: *cronEnv

  - type: cron
    name: lion-elite-daily-analytics
    runtime: node
    schedule: "0 12 * * *"
    buildCommand: npm install --no-audit --no-fund
    startCommand: node scripts/cron-scheduler.js analytics
    envVars: *cronEnv

  - type: cron
    name: lion-elite-weekly-maintenance
    runtime: node
    schedule: "0 7 * * 0"
    buildCommand: npm install --no-audit --no-fund
    startCommand: node scripts/cron-scheduler.js cleanup
    envVars: *cronEnv

  - type: cron
    name: lion-elite-morning-brief
    runtime: node
    schedule: "0 11 * * *"
    buildCommand: npm install --no-audit --no-fund
    startCommand: node scripts/cron-scheduler.js morningBrief
    envVars: *cronEnv

  - type: cron
    name: lion-elite-midday-revenue
    runtime: node
    schedule: "0 16 * * *"
    buildCommand: npm install --no-audit --no-fund
    startCommand: node scripts/cron-scheduler.js middayRevenue
    envVars: *cronEnv

  - type: cron
    name: lion-elite-evening-review
    runtime: node
    schedule: "0 23 * * *"
    buildCommand: npm install --no-audit --no-fund
    startCommand: node scripts/cron-scheduler.js eveningReview
    envVars: *cronEnv

  - type: cron
    name: lion-elite-hourly-health
    runtime: node
    schedule: "15 * * * *"
    buildCommand: npm install --no-audit --no-fund
    startCommand: node scripts/cron-scheduler.js healthSnapshot
    envVars: *cronEnv

  - type: cron
    name: lion-elite-revenue-report
    runtime: node
    schedule: "0 12 * * *"
    buildCommand: npm install --no-audit --no-fund
    startCommand: node scripts/revenue-report.js --days=1
    envVars: *cronEnv
