name: Trigger Render Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Trigger Render Deploy Hook
    runs-on: ubuntu-latest

    steps:
      - name: Check deploy hook secret
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "Missing GitHub secret: RENDER_DEPLOY_HOOK_URL"
            echo "Add your Render deploy hook URL as a repository secret before running this workflow."
            exit 1
          fi

      - name: Trigger Render deploy
        run: |
          curl --fail --show-error --location --request POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo "Render deploy hook triggered successfully."

      # A 200 from the deploy hook only means Render accepted the request. This
      # step confirms the commit just merged is the one actually serving
      # traffic, by polling the service's own /health for RENDER_GIT_COMMIT.
      # No Render API key is involved.
      - name: Verify the deploy actually shipped this commit
        env:
          SERVICE_URL: ${{ vars.RENDER_SERVICE_URL || 'https://lion-elite-os.onrender.com' }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          echo "Waiting for $SERVICE_URL/health to report $EXPECTED_SHA"
          deadline=$(( $(date +%s) + 600 ))
          reported=""
          responded=0

          while [ "$(date +%s)" -lt "$deadline" ]; do
            body=$(curl -fsS --max-time 20 "$SERVICE_URL/health" 2>/dev/null || true)
            if [ -n "$body" ]; then
              responded=1
              reported=$(printf '%s' "$body" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("commit",""))' 2>/dev/null || true)
              if [ -n "$reported" ] && [ "$reported" = "$EXPECTED_SHA" ]; then
                echo "Verified: $SERVICE_URL is serving $EXPECTED_SHA."
                echo "- Deploy **verified**: serving \`$EXPECTED_SHA\`" >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              # An older build is still up; keep waiting for the rollover.
              echo "Serving '${reported:-<no commit field>}', waiting..."
            else
              echo "No response yet, waiting..."
            fi
            sleep 20
          done

          if [ "$responded" -eq 0 ]; then
            echo "::error::$SERVICE_URL never responded. The deploy did not come up."
            echo "- Deploy **FAILED**: $SERVICE_URL never responded" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [ -z "$reported" ]; then
            # Service is up but cannot say what it is running. Do not fail the
            # build for it, but never report this as a verified deploy either.
            echo "::warning::$SERVICE_URL is up but reports no commit. Cannot verify which build is live."
            echo "- Deploy **unverified**: service up, no commit reported" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "::error::$SERVICE_URL is still serving $reported, not $EXPECTED_SHA."
          echo "- Deploy **FAILED**: still serving \`$reported\`" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Optional Render status visibility
        run: |
          if [ -z "${{ secrets.RENDER_API_KEY }}" ] || [ -z "${{ secrets.RENDER_SERVICE_ID }}" ]; then
            echo "Render API status check skipped (RENDER_API_KEY / RENDER_SERVICE_ID not set)."
            echo "This is optional: the deploy was already verified against /health above."
            exit 0
          fi

          echo "Checking latest Render deploy status..."

          python - <<'PY'
          import json
          import os
          import sys
          import time
          import urllib.request

          api_key = os.environ.get("RENDER_API_KEY_SECRET")
          service_id = os.environ.get("RENDER_SERVICE_ID_SECRET")

          url = f"https://api.render.com/v1/services/{service_id}/deploys?limit=1"
          headers = {
              "Authorization": f"Bearer {api_key}",
              "Accept": "application/json",
          }

          terminal_success = {"live", "succeeded"}
          terminal_failure = {"failed", "canceled", "cancelled"}

          for attempt in range(30):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  data = json.loads(response.read().decode("utf-8"))

              deploys = data if isinstance(data, list) else data.get("deploys", [])
              if not deploys:
                  print("No Render deploys returned yet. Waiting...")
                  time.sleep(20)
                  continue

              latest = deploys[0]
              deploy = latest.get("deploy", latest)
              status = str(deploy.get("status", "unknown")).lower()
              deploy_id = deploy.get("id", "unknown")

              print(f"Latest Render deploy: {deploy_id}")
              print(f"Status: {status}")

              if status in terminal_success:
                  print("Render deploy completed successfully.")
                  sys.exit(0)

              if status in terminal_failure:
                  print("Render deploy failed.")
                  sys.exit(1)

              time.sleep(20)

          print("Render deploy did not reach a final status before timeout.")
          sys.exit(1)
          PY
        env:
          RENDER_API_KEY_SECRET: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID_SECRET: ${{ secrets.RENDER_SERVICE_ID }}
