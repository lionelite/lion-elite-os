name: CI and Render Blueprint Validation

on:
  push:
    branches: [main, claude-automation]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lion_elite_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lion_elite_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lion_elite_test
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate JavaScript syntax
        run: |
          node --check server.js
          node --check outreach-server-postgres.js
          node --check executive-orchestrator.js
          node --check integration-gateway-server.js
          node --check workers/outreach-worker.js
          node --check workers/executive-worker.js
          node --check workers/integration-worker.js
          node --check scripts/cron-scheduler.js
          node --check scripts/operations-monitor.js

      - name: Validate Render blueprint references
        run: node scripts/validate-render-blueprint.js

      - name: Startup smoke test (catches missing-module/wrong-export regressions)
        run: node scripts/smoke-check.js

      - name: Run automated tests
        run: npm test
