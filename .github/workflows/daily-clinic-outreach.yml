name: Daily clinic outreach

# Triggers the in-process clinic outreach run on the free Render web service
# (POST /api/cron/clinic-outreach, routes/clinic-outreach-cron.js). No Redis,
# workers or Render cron are needed.
#
# Every 30 minutes 9 AM–10:59 PM New York, every day. The local-time guard
# handles DST; the HTTP sender is bounded to 8 minutes per call on Render.
# Re-runs are safe: advisory lock + daily cap + org/step idempotency.
on:
  schedule:
    # UTC hours overlap both EST and EDT local daytime; guard below narrows it.
    - cron: '7,37 13-23 * * *'
    - cron: '7,37 0-3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: discover and qualify, but queue and send nothing'
        type: boolean
        default: true

# id-token: write lets the job request a short-lived GitHub OIDC token, which
# the service verifies (lib/outreach/github-oidc.js). No shared secret needed.
permissions:
  contents: read
  id-token: write

concurrency:
  group: daily-clinic-outreach
  cancel-in-progress: false

env:
  SERVICE_URL: https://lion-elite-os.onrender.com

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Keep only New York 9 AM–10:59 PM
        id: guard
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "Manual dispatch — running."; exit 0; fi
          hour="$(TZ=America/New_York date +%H)"
          if [ "$((10#$hour))" -lt 9 ] || [ "$((10#$hour))" -gt 22 ]; then
            echo "New York hour $hour is outside permitted send window. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Wake Render service
        if: steps.guard.outputs.skip != 'true'
        run: |
          # Free instances sleep after 15 idle minutes; the first request wakes them.
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 60 "$SERVICE_URL/health" > /dev/null; then echo "Service is up."; exit 0; fi
            echo "Not up yet (attempt $i); waiting 20s."; sleep 20
          done
          echo "::error::Service did not answer /health."; exit 1

      # Discovery is its own job (clinic-discovery.yml, every 2 h). This run only
      # qualifies and sends what that job stored; the old metro prefetch fed an
      # in-process search the send run no longer does.

      # Fetched after the wake-up: the token lives about five minutes.
      - name: Get GitHub identity token
        if: steps.guard.outputs.skip != 'true'
        id: oidc
        run: |
          token="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=lion-elite-os-cron" | jq -r .value)"
          if [ -z "$token" ] || [ "$token" = "null" ]; then echo "::error::Could not get an OIDC token."; exit 1; fi
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Trigger outreach run
        if: steps.guard.outputs.skip != 'true'
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
        run: |
          set -o pipefail
          url="$SERVICE_URL/api/cron/clinic-outreach"
          if [ "$DRY_RUN" = "1" ]; then url="$url?dryRun=1"; fi
          curl -fsS -X POST "$url" \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "content-type: application/json" \
            --max-time 6900 > summary.json
          jq . summary.json
          status="$(jq -r .status summary.json)"
          {
            echo "## Clinic outreach run: $status"
            echo
            jq -r '"| discovered | qualified | sent | failed | skipped |\n|---|---|---|---|---|\n| \(.discovered) | \(.qualified) | \(.sent) | \(.failed) | \(.skipped) |"' summary.json
            echo
            echo '```json'
            jq '{status, reason, dryRun, cap, skipReasons, notes, mirror, discovery}' summary.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          case "$status" in
            completed|paused|skipped) exit 0 ;;
            *) echo "::error::Run status: $status"; exit 1 ;;
          esac
