name: Real Estate Intelligence

on:
  pull_request:
    paths:
      - 'real-estate/intelligence/**'
      - 'package.json'
      - '.github/workflows/real-estate-intelligence.yml'
  push:
    branches: [main]
    paths:
      - 'real-estate/intelligence/**'
      - 'package.json'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node --test real-estate/intelligence/test/*.test.js
      - run: node real-estate/intelligence/src/demo.js
