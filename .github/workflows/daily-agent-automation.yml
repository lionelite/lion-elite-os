name: Daily Agent Automation

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      brand:
        description: 'Brand lane'
        required: false
        default: 'Lion Elite Beauty'
      topic:
        description: 'Daily topic'
        required: false
        default: 'daily lead generation'
      task:
        description: 'Execution task'
        required: false
        default: 'Complete the highest-impact work first.'
  push:
    branches:
      - main
    paths:
      - 'automation-triggers/**'
      - '.github/workflows/daily-agent-automation.yml'

permissions:
  contents: write

concurrency:
  group: daily-agent-automation
  cancel-in-progress: false

jobs:
  run-agents:
    name: Run Daily Agent System
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build daily execution output
        env:
          INPUT_BRAND: ${{ inputs.brand || 'Lion Elite Beauty' }}
          INPUT_TOPIC: ${{ inputs.topic || 'daily lead generation' }}
          INPUT_TASK: ${{ inputs.task || 'Complete the highest-impact work first.' }}
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          import os
          import pathlib

          now = datetime.now(timezone.utc)
          date = now.strftime('%Y-%m-%d')
          stamp = now.strftime('%Y-%m-%dT%H-%M-%SZ')
          brand = os.environ.get('INPUT_BRAND', 'Lion Elite Beauty')
          topic = os.environ.get('INPUT_TOPIC', 'daily lead generation')
          task = os.environ.get('INPUT_TASK', 'Complete the highest-impact work first.')

          output = f"""# Daily Agent Automation — {date}

Generated: {stamp}
Brand: {brand}
Topic: {topic}

## CEO Execution Priority
Complete the highest-impact work first: revenue, follow-up, content, and operational cleanup.

## Task
{task}

## Agent Queue

### CEO Execution Agent
- Pick today's highest-impact money move.
- Turn the day into a clear execution order.

### Content Production Agent
- Create ready-to-post content for the correct brand lane.
- Keep each slide or asset individual.

### Lion Elite Wellness Research Agent
- Produce research-only educational content.
- No human-use claims, dosing, treatment claims, or transformation promises.

### Lion Elite Beauty Coaching Agent
- Build high-ticket coaching, transformation, affiliate, and influencer content.

### AlexTheLionLifts Personal Brand Agent
- Build authority through discipline, lifting, leadership, faith, and coaching credibility.

### Sales Follow-Up Agent
- Draft short follow-up messages that build value and end with a question.

### Funnel and Website Agent
- Improve pages, CTAs, lead capture, and conversion copy.

### Operations Agent
- Create SOPs, checklists, triggers, and quality-control steps.

### GitHub Task Agent
- Convert business needs into GitHub issues and implementation tasks.

### Money and Growth Agent
- Identify today's offer, lead source, conversion action, and KPI.

## Next Action
Open the highest-priority queue and execute one revenue-producing task before creating more planning notes.
"""

          outdir = pathlib.Path('agent-outputs') / date
          outdir.mkdir(parents=True, exist_ok=True)
          outfile = outdir / f'daily-agent-automation-{stamp}.md'
          outfile.write_text(output, encoding='utf-8')

          latest = pathlib.Path('agent-outputs') / 'LATEST_DAILY_AUTOMATION.md'
          latest.parent.mkdir(parents=True, exist_ok=True)
          latest.write_text(output, encoding='utf-8')

          print(f'Wrote {outfile}')
          print('Wrote agent-outputs/LATEST_DAILY_AUTOMATION.md')
          PY

      - name: Commit agent output
        run: |
          git config user.name "Lion Elite Agent Automation"
          git config user.email "actions@github.com"
          git pull --rebase origin main || true
          git add agent-outputs/ || true
          if git diff --cached --quiet; then
            echo "No output changes to commit."
          else
            git commit -m "Save daily agent automation output"
            git push || echo "Push skipped because remote changed. Next run will retry."
          fi
